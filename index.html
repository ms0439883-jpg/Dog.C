<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毛緣配對 — 寵物認養</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,700;1,300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #FFF8F0; --warm-bg: #FDF2E8; --card-bg: #FFFAF6;
  --orange: #E07040; --orange-light: #FDE8D8; --orange-dark: #A03C1A;
  --brown: #3D2314; --brown-mid: #7A4A30; --brown-light: #B08070;
  --green: #2A7A40; --green-bg: #E8F5E8;
  --red: #CC3030; --red-bg: #FFECEC;
  --blue: #2060A0; --blue-bg: #DDEEFF;
  --border: rgba(61,35,20,0.12);
  --radius: 20px; --shadow: 0 8px 32px rgba(61,35,20,0.14);
}
body { font-family: 'DM Sans', sans-serif; background: var(--cream); min-height: 100vh; color: var(--brown); }
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input, select { font-family: inherit; outline: none; }

/* 載入畫面 */
#loading-screen {
  position: fixed; inset: 0; background: var(--cream);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 1000; gap: 16px;
}
.logo-big { font-family: 'Fraunces', serif; font-size: 40px; font-weight: 700; color: var(--brown); }
.logo-big span { color: var(--orange); }
.spinner {
  width: 32px; height: 32px; border: 3px solid var(--orange-light);
  border-top-color: var(--orange); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 登入畫面 */
#auth-screen {
  min-height: 100vh; display: flex; align-items: center;
  justify-content: center; padding: 24px;
  background: linear-gradient(160deg, #FFF8F0 0%, #FDE8D8 100%);
}
.auth-card {
  background: white; border-radius: 28px; border: 1px solid var(--border);
  padding: 48px 40px; width: 100%; max-width: 400px;
  box-shadow: 0 20px 60px rgba(61,35,20,0.12); text-align: center;
}
.auth-paw { font-size: 52px; margin-bottom: 12px; display: block; }
.auth-logo { font-family: 'Fraunces', serif; font-size: 34px; font-weight: 700; color: var(--brown); margin-bottom: 6px; }
.auth-logo span { color: var(--orange); }
.auth-tagline { font-family: 'Fraunces', serif; font-style: italic; color: var(--brown-light); font-size: 15px; margin-bottom: 36px; }
.google-btn {
  width: 100%; padding: 14px 20px; background: white; border: 1.5px solid var(--border);
  border-radius: 14px; font-size: 15px; font-weight: 600; color: var(--brown); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  transition: all 0.2s; box-shadow: 0 2px 8px rgba(61,35,20,0.08);
}
.google-btn:hover { border-color: var(--orange); box-shadow: 0 4px 16px rgba(224,112,64,0.2); transform: translateY(-1px); }
.google-icon { width: 20px; height: 20px; flex-shrink: 0; }
.auth-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--brown-light); font-size: 13px; }
.auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.guest-btn {
  width: 100%; padding: 12px; background: var(--warm-bg); border: none;
  border-radius: 14px; font-size: 14px; color: var(--brown-mid); cursor: pointer; transition: background 0.2s;
}
.guest-btn:hover { background: var(--orange-light); }
.auth-note { margin-top: 24px; font-size: 12px; color: var(--brown-light); line-height: 1.6; }

/* 頂部欄 */
.top-bar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,248,240,0.95); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.logo { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; color: var(--brown); white-space: nowrap; }
.logo span { color: var(--orange); }

/* 篩選列 */
.filter-bar {
  background: white; border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  position: sticky; top: 53px; z-index: 99;
}
.filter-group { display: flex; gap: 6px; align-items: center; }
.filter-label { font-size: 11px; font-weight: 600; color: var(--brown-light); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.filter-chip {
  padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
  border: 1.5px solid var(--border); background: white; color: var(--brown-mid);
  transition: all 0.15s; cursor: pointer; white-space: nowrap;
}
.filter-chip.active { background: var(--brown); color: white; border-color: var(--brown); }
.filter-divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.filter-select {
  padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
  border: 1.5px solid var(--border); background: white; color: var(--brown-mid);
  cursor: pointer; max-width: 140px;
}
.filter-select:disabled { opacity: 0.4; cursor: not-allowed; }

/* 用戶選單 */
.user-menu { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 50%; background: white;
  border: 1.5px solid var(--border); display: flex; align-items: center;
  justify-content: center; color: var(--brown-mid); cursor: pointer; font-size: 16px; transition: all 0.15s;
}
.icon-btn:hover { background: var(--warm-bg); }
.user-avatar {
  width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
  border: 2px solid var(--orange-light); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--orange-light); font-size: 14px; font-weight: 600;
  color: var(--orange-dark); position: relative; flex-shrink: 0;
}
.liked-badge {
  position: absolute; top: -4px; right: -4px; background: var(--orange); color: white;
  border-radius: 50%; width: 16px; height: 16px; font-size: 10px;
  display: flex; align-items: center; justify-content: center; font-weight: 700;
}

/* 主內容 */
#app-screen { min-height: 100vh; display: flex; flex-direction: column; }
.main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 40px; gap: 16px; }

/* API 狀態 */
.api-status {
  width: 100%; max-width: 420px; border-radius: 12px;
  padding: 10px 16px; font-size: 13px; display: flex; align-items: center; gap: 8px;
}
.api-status.loading { background: var(--orange-light); color: var(--orange-dark); }
.api-status.success { background: var(--green-bg); color: var(--green); }
.api-status.error { background: var(--red-bg); color: var(--red); }

/* 카드 스택 */
.card-stack-wrap { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.card-stack { position: relative; width: 100%; height: 520px; }

/* 寵物卡片 */
.pet-card {
  position: absolute; inset: 0; border-radius: var(--radius);
  background: var(--card-bg); border: 1px solid var(--border); overflow: hidden;
  cursor: grab; user-select: none; transform-origin: center 90%;
  will-change: transform; transition: box-shadow 0.2s;
}
.pet-card:active { cursor: grabbing; }
.pet-card.z2 { z-index: 3; box-shadow: var(--shadow); }
.pet-card.z1 { z-index: 2; transform: scale(0.96) translateY(8px); pointer-events: none; }
.pet-card.z0 { z-index: 1; transform: scale(0.92) translateY(16px); pointer-events: none; }

/* 照片區 */
.card-photo-wrap { position: relative; width: 100%; height: 56%; overflow: hidden; background: var(--warm-bg); }
.card-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-photo-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 88px; }
.days-badge {
  position: absolute; top: 12px; left: 12px;
  background: rgba(61,35,20,0.75); color: white;
  border-radius: 10px; padding: 4px 10px; font-size: 12px; font-weight: 600;
  backdrop-filter: blur(4px);
}
.days-badge.long { background: rgba(204,48,48,0.82); }

/* 卡片資訊 */
.card-body { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; height: 44%; }
.card-main-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.pet-species { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; color: var(--brown); line-height: 1.1; }
.pet-breed { font-size: 12px; color: var(--brown-light); margin-top: 3px; }
.shelter-badge {
  font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px;
  background: var(--blue-bg); color: var(--blue); white-space: nowrap; flex-shrink: 0; max-width: 130px;
  overflow: hidden; text-overflow: ellipsis; text-align: right;
}
.card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag {
  font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 10px;
  background: var(--warm-bg); color: var(--brown-mid);
}
.tag.green { background: var(--green-bg); color: var(--green); }
.tag.red { background: var(--red-bg); color: var(--red); }
.tag.blue { background: var(--blue-bg); color: var(--blue); }
.card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.shelter-name { font-size: 11px; color: var(--brown-light); display: flex; align-items: center; gap: 3px; flex: 1; overflow: hidden; }
.shelter-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail-link {
  font-size: 12px; font-weight: 600; color: var(--orange);
  display: flex; align-items: center; gap: 3px; white-space: nowrap;
  text-decoration: none; flex-shrink: 0;
}
.detail-link:hover { text-decoration: underline; }

/* 滑動提示 */
.swipe-label {
  position: absolute; top: 20px;
  font-family: 'Fraunces', serif; font-size: 24px; font-weight: 700;
  padding: 5px 14px; border-radius: 12px; border: 3px solid;
  opacity: 0; pointer-events: none; z-index: 10; transition: opacity 0.08s;
}
.label-like { left: 16px; color: var(--green); border-color: var(--green); background: rgba(42,122,64,0.08); }
.label-nope { right: 16px; color: var(--red); border-color: var(--red); background: rgba(204,48,48,0.08); }

/* 操作按鈕 */
.action-row { display: flex; align-items: center; justify-content: center; gap: 20px; }
.act-btn {
  width: 64px; height: 64px; border-radius: 50%; background: white;
  border: 1.5px solid var(--border); display: flex; align-items: center;
  justify-content: center; font-size: 26px; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.act-btn:hover { transform: scale(1.08); }
.act-btn:active { transform: scale(0.94); }
.act-btn.nope { color: var(--red); box-shadow: 0 4px 16px rgba(204,48,48,0.15); }
.act-btn.like { color: var(--green); box-shadow: 0 4px 16px rgba(42,122,64,0.15); }
.act-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

/* 動畫 */
.fly-right { animation: flyRight 0.36s ease forwards; }
.fly-left  { animation: flyLeft  0.36s ease forwards; }
@keyframes flyRight { to { transform: translateX(130%) rotate(22deg); opacity: 0; } }
@keyframes flyLeft  { to { transform: translateX(-130%) rotate(-22deg); opacity: 0; } }

/* 收藏列 */
.liked-shelf { width: 100%; max-width: 400px; background: white; border-radius: 16px; border: 1px solid var(--border); padding: 14px 16px; }
.shelf-title { font-size: 11px; font-weight: 600; color: var(--brown-light); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.shelf-title a { font-size: 12px; text-transform: none; letter-spacing: 0; color: var(--orange); text-decoration: none; }
.shelf-row { display: flex; gap: 8px; flex-wrap: wrap; }
.shelf-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.shelf-thumb {
  width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
  border: 2.5px solid var(--orange); background: var(--orange-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; transition: transform 0.15s;
}
.shelf-thumb img { width: 100%; height: 100%; object-fit: cover; }
.shelf-thumb:hover { transform: scale(1.1); }
.shelf-name { font-size: 10px; text-align: center; color: var(--brown-mid); margin-top: 3px; max-width: 44px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 空狀態 */
.empty-state { text-align: center; padding: 60px 20px; color: var(--brown-light); font-family: 'Fraunces', serif; font-style: italic; font-size: 17px; line-height: 1.8; }
.empty-icon { font-size: 60px; display: block; margin-bottom: 14px; }

/* 收藏頁 */
#saved-screen { position: fixed; inset: 0; background: var(--cream); z-index: 150; overflow-y: auto; }
.saved-header { padding: 16px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); background: white; position: sticky; top: 0; z-index: 10; }
.saved-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; color: var(--brown); }
.saved-grid { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.saved-card { background: white; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; position: relative; }
.saved-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.saved-card-img { width: 100%; height: 110px; object-fit: cover; display: block; }
.saved-card-ph { width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; font-size: 48px; }
.saved-card-info { padding: 8px 10px 10px; }
.saved-card-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; color: var(--brown); }
.saved-card-meta { font-size: 11px; color: var(--brown-light); margin-top: 2px; line-height: 1.5; }
.saved-card-link { font-size: 11px; color: var(--orange); font-weight: 600; margin-top: 4px; display: flex; align-items: center; gap: 2px; }
.remove-btn { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; background: rgba(255,255,255,0.92); border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--red); }

/* 用戶選單 popup */
#user-menu-popup {
  position: fixed; top: 56px; right: 12px; z-index: 300;
  background: white; border-radius: 14px; border: 1px solid var(--border);
  padding: 8px; box-shadow: var(--shadow); min-width: 180px;
}
.menu-email { padding: 8px 12px; font-size: 12px; color: var(--brown-light); border-bottom: 1px solid var(--border); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.menu-item { width: 100%; padding: 9px 12px; background: none; border: none; text-align: left; cursor: pointer; font-size: 14px; border-radius: 8px; display: flex; align-items: center; gap: 8px; transition: background 0.15s; color: var(--brown); }
.menu-item:hover { background: var(--warm-bg); }
.menu-item.danger { color: var(--red); }

@media (max-width: 480px) {
  .top-bar { padding: 8px 12px; }
  .filter-bar { padding: 8px 12px; gap: 6px; }
  .card-stack { height: 490px; }
  .auth-card { padding: 36px 24px; }
}
</style>
</head>
<body>

<!-- 載入畫面 -->
<div id="loading-screen">
  <div class="logo-big">毛緣<span>配對</span></div>
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--brown-light)">連線中...</div>
</div>

<!-- 登入畫面 -->
<div id="auth-screen" class="hidden">
  <div class="auth-card">
    <span class="auth-paw">🐾</span>
    <div class="auth-logo">毛緣<span>配對</span></div>
    <div class="auth-tagline">幫每隻毛孩找到有緣人</div>
    <button class="google-btn" onclick="loginWithGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      用 Google 帳號登入
    </button>
    <div class="auth-divider">或</div>
    <button class="guest-btn" onclick="guestMode()">
      <i class="ti ti-eye" style="margin-right:6px"></i>訪客瀏覽（不儲存收藏）
    </button>
    <div class="auth-note">登入後可儲存有興趣的毛孩，資料安全不外洩。</div>
  </div>
</div>

<!-- 主畫面 -->
<div id="app-screen" class="hidden">

  <div class="top-bar">
    <div class="logo">毛緣<span>配對</span></div>
    <div class="user-menu">
      <button class="icon-btn" onclick="showSaved()" title="我的收藏">
        <i class="ti ti-heart"></i>
      </button>
      <div class="user-avatar" id="avatar-btn" onclick="toggleMenu()">
        <span id="avatar-letter">?</span>
        <div class="liked-badge hidden" id="liked-badge">0</div>
      </div>
    </div>
  </div>

  <!-- 篩選列 -->
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">物種</span>
      <button class="filter-chip active" onclick="setKind(this,'all')">全部</button>
      <button class="filter-chip" onclick="setKind(this,'犬')">🐶 犬</button>
      <button class="filter-chip" onclick="setKind(this,'貓')">🐱 貓</button>
      <button class="filter-chip" onclick="setKind(this,'other')">🐾 其他</button>
    </div>
    <div class="filter-divider"></div>
    <div class="filter-group">
      <span class="filter-label">縣市</span>
      <select class="filter-select" id="city-filter" onchange="setCity(this.value)">
        <option value="all">全台</option>
      </select>
    </div>
    <div class="filter-group" id="shelter-group">
      <span class="filter-label">收容所</span>
      <select class="filter-select" id="shelter-filter" onchange="setShelter(this.value)" disabled>
        <option value="all">全部</option>
      </select>
    </div>
  </div>

  <div class="main-content">
    <div id="api-status" class="api-status loading">
      <div class="spinner" style="width:16px;height:16px;border-width:2px"></div>
      <span>從農業部載入認養資料...</span>
    </div>

    <div class="card-stack-wrap">
      <div class="card-stack" id="card-stack"></div>
      <div class="action-row">
        <button class="act-btn nope" id="btn-nope" onclick="doSwipe('nope')" disabled title="跳過">
          <i class="ti ti-x"></i>
        </button>
        <button class="act-btn like" id="btn-like" onclick="doSwipe('like')" disabled title="有興趣">
          <i class="ti ti-heart"></i>
        </button>
      </div>
    </div>

    <div class="liked-shelf hidden" id="liked-shelf">
      <div class="shelf-title">
        已感興趣的毛孩
        <a href="#" onclick="showSaved();return false;">查看全部 →</a>
      </div>
      <div class="shelf-row" id="shelf-row"></div>
    </div>
  </div>
</div>

<!-- 收藏頁 -->
<div id="saved-screen" class="hidden">
  <div class="saved-header">
    <button class="icon-btn" onclick="hideSaved()"><i class="ti ti-arrow-left"></i></button>
    <div class="saved-title">已收藏的毛孩</div>
  </div>
  <div class="saved-grid" id="saved-grid"></div>
</div>

<!-- 用戶選單 -->
<div id="user-menu-popup" class="hidden">
  <div class="menu-email" id="menu-email"></div>
  <button class="menu-item" onclick="showSaved();toggleMenu()"><i class="ti ti-heart"></i> 我的收藏</button>
  <button class="menu-item danger" onclick="doLogout()"><i class="ti ti-logout"></i> 登出</button>
</div>

<script>

// ══════════ 工具：Base64（產生 pet.gov.tw 連結用）══════════
function toB64(str) {
  try { return btoa(unescape(encodeURIComponent(str))); } catch(e) { return btoa(str); }
}
function petGovUrl(subid, shelterPkid) {
  const acnum = toB64(String(subid));
  const ut    = toB64(String(shelterPkid));
  return `https://www.pet.gov.tw/AnimalApp/AnnounceSingle.aspx?PageType=Adopt&AcNum=${acnum}&UT=${encodeURIComponent(ut)}`;
}

// ══════════ 入所天數 ══════════
function calcDays(opendate) {
  if (!opendate) return null;
  const d = new Date(opendate);
  if (isNaN(d)) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

// ══════════ 農業部 API ══════════
async function loadPets() {
  setStatus('loading', '從農業部載入認養資料...');
  try {
    const res = await fetch(PROXY + encodeURIComponent(API_URL));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    allPets = raw.filter(a => a.animal_status === 'OPEN').map(normalizePet);
    buildCityFilter();
    applyFilters();
    setStatus('success', `已載入 ${allPets.length} 隻待認養毛孩（農業部資料）`);
  } catch(e) {
    console.error(e);
    setStatus('error', '無法連線，顯示示範資料');
    allPets = demoPets();
    buildCityFilter();
    applyFilters();
  }
}

const CITY_MAP = {
  '63':'台北市','65':'新北市','68':'桃園市','10018':'新竹市','10004':'新竹縣',
  '10005':'苗栗縣','66':'台中市','10007':'彰化縣','10008':'南投縣','10009':'雲林縣',
  '10010':'嘉義縣','10020':'嘉義市','67':'台南市','64':'高雄市','10013':'屏東縣',
  '10017':'宜蘭縣','10015':'花蓮縣','10014':'台東縣','10016':'澎湖縣',
  '09007':'金門縣','09020':'連江縣'
};

function normalizePet(a) {
  const kindRaw = (a.animal_kind || '').trim();
  const kind    = kindRaw.includes('犬') ? '犬' : kindRaw.includes('貓') ? '貓' : '其他';
  const emoji   = kind === '犬' ? '🐶' : kind === '貓' ? '🐱' : '🐾';
  const bg      = kind === '犬' ? '#FFF0E0' : kind === '貓' ? '#EEF0FF' : '#F0FFF0';
  const sexMap  = { M:'公', F:'母', N:'未知' };

  // 照片：album_file 是完整 URL，可能多張用分號隔開，強制 https
  let photo = null;
  if (a.album_file) {
    const parts = a.album_file.split(';').map(s => s.trim()).filter(Boolean);
    if (parts.length) {
      photo = parts[0].replace(/^http:\/\//i, 'https://');
    }
  }

  const city    = CITY_MAP[a.animal_area_pkid] || '';
  const shelter = (a.shelter_name || '').trim();
  const subid   = a.animal_subid || '';
  const pkid    = a.animal_shelter_pkid || '';
  const days    = calcDays(a.animal_opendate);

  const tags = [];
  if (sexMap[a.animal_sex]) tags.push({ t: sexMap[a.animal_sex], c: a.animal_sex === 'M' ? 'blue' : 'red' });
  if (a.animal_sterilization === 'Y') tags.push({ t: '已結紮', c: 'green' });
  else if (a.animal_sterilization === 'N') tags.push({ t: '未結紮', c: '' });
  if (a.animal_bacterin === 'Y') tags.push({ t: '已打疫苗', c: 'green' });
  if (a.animal_bodytype) tags.push({ t: a.animal_bodytype, c: '' });

  return {
    id: String(a.animal_id),
    subid, pkid,
    kind, emoji, bg,
    species: kindRaw || '未知',
    breed: (a.animal_Variety || kindRaw || '未知品種').trim(),
    colour: a.animal_colour || '',
    city, shelter, photo, tags, days,
    opendate: a.animal_opendate ? a.animal_opendate.slice(0, 10) : '',
    remark: a.animal_remark || a.animal_caption || '',
    shelterTel: a.shelter_tel || '',
    petUrl: petGovUrl(subid, pkid)
  };
}

// ══════════ 篩選 ══════════
function buildCityFilter() {
  const cities = [...new Set(allPets.map(p => p.city).filter(Boolean))].sort();
  const sel = document.getElementById('city-filter');
  sel.innerHTML = '<option value="all">全台</option>';
  cities.forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o);
  });
}

function setKind(btn, kind) {
  kindFilter = kind;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function setCity(val) {
  cityFilter = val; shelterFilter = 'all';
  const shelSel = document.getElementById('shelter-filter');
  if (val === 'all') {
    shelSel.innerHTML = '<option value="all">全部</option>';
    shelSel.disabled = true;
  } else {
    const shelters = [...new Set(
      allPets.filter(p => p.city === val).map(p => p.shelter).filter(Boolean)
    )].sort();
    shelSel.innerHTML = '<option value="all">全部</option>';
    shelters.forEach(s => {
      const o = document.createElement('option'); o.value = s; o.textContent = s; shelSel.appendChild(o);
    });
    shelSel.disabled = false;
  }
  applyFilters();
}

function setShelter(val) { shelterFilter = val; applyFilters(); }

function applyFilters() {
  filteredPets = allPets.filter(p => {
    if (kindFilter !== 'all') {
      if (kindFilter === 'other' && (p.kind === '犬' || p.kind === '貓')) return false;
      if (kindFilter !== 'other' && p.kind !== kindFilter) return false;
    }
    if (cityFilter !== 'all' && p.city !== cityFilter) return false;
    if (shelterFilter !== 'all' && p.shelter !== shelterFilter) return false;
    return true;
  });
  // 打亂順序
  for (let i = filteredPets.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredPets[i], filteredPets[j]] = [filteredPets[j], filteredPets[i]];
  }
  currentIndex = 0;
  renderStack();
}

// ══════════ 卡片渲染 ══════════
function renderStack() {
  const stack = document.getElementById('card-stack');
  stack.innerHTML = '';
  const rem = filteredPets.slice(currentIndex);
  enableBtns(rem.length > 0);
  if (!rem.length) {
    stack.innerHTML = `<div class="empty-state"><span class="empty-icon">🎉</span>這個條件的毛孩都看完了！<br>換個篩選條件，或稍後再來。</div>`;
    return;
  }
  const n = Math.min(3, rem.length);
  for (let i = n - 1; i >= 0; i--) stack.appendChild(buildCard(rem[i], i));
  const front = stack.querySelector('.z2');
  if (front) attachDrag(front);
}

function buildCard(pet, layer) {
  const card = document.createElement('div');
  card.className = `pet-card z${2 - layer}`;

  // 照片
  const photoHtml = pet.photo
    ? `<img class="card-photo" src="${pet.photo}" alt="${pet.species}"
         loading="lazy"
         onerror="this.style.display='none';this.parentElement.querySelector('.card-photo-ph').style.display='flex'">`
    : '';
  const phStyle = pet.photo ? 'display:none' : '';

  // 入所天數徽章
  let daysBadge = '';
  if (pet.days !== null) {
    const cls = pet.days > 90 ? 'days-badge long' : 'days-badge';
    daysBadge = `<div class="${cls}">入所 ${pet.days} 天</div>`;
  }

  // 標籤
  const tagsHtml = pet.tags.map(t => `<span class="tag ${t.c}">${t.t}</span>`).join('');

  card.innerHTML = `
    <div class="card-photo-wrap">
      ${photoHtml}
      <div class="card-photo-ph" style="background:${pet.bg};${phStyle}">${pet.emoji}</div>
      ${daysBadge}
    </div>
    <div class="card-body">
      <div class="card-main-row">
        <div>
          <div class="pet-species">${pet.species}</div>
          <div class="pet-breed">${pet.breed}${pet.colour ? '・' + pet.colour : ''}</div>
        </div>
        <div class="shelter-badge" title="${pet.shelter}">${pet.shelter}</div>
      </div>
      <div class="card-tags">${tagsHtml}</div>
      <div class="card-footer">
        <div class="shelter-name">
          <i class="ti ti-map-pin" style="font-size:11px;flex-shrink:0"></i>
          <span>${pet.city}${pet.shelterTel ? '・' + pet.shelterTel : ''}</span>
        </div>
        <a class="detail-link" href="${pet.petUrl}" target="_blank" onclick="event.stopPropagation()">
          詳細資訊 <i class="ti ti-external-link" style="font-size:11px"></i>
        </a>
      </div>
    </div>
    <div class="swipe-label label-like">❤️ 有緣</div>
    <div class="swipe-label label-nope">✕ 跳過</div>`;
  return card;
}

// ══════════ 拖曳 ══════════
let dragging = false, sx = 0, sy = 0, cx = 0;
function attachDrag(card) {
  card.addEventListener('mousedown', s);
  card.addEventListener('touchstart', s, { passive: true });
  function s(e) {
    if (e.target.closest('a')) return; // 不攔截連結點擊
    dragging = true; cx = 0;
    card.style.transition = 'none';
    const p = e.touches ? e.touches[0] : e;
    sx = p.clientX; sy = p.clientY;
    document.addEventListener('mousemove', m);
    document.addEventListener('touchmove', m, { passive: true });
    document.addEventListener('mouseup', en);
    document.addEventListener('touchend', en);
  }
  function m(e) {
    if (!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    cx = p.clientX - sx;
    const cy = (p.clientY - sy) * 0.3;
    card.style.transform = `translateX(${cx}px) translateY(${cy}px) rotate(${cx * 0.06}deg)`;
    const th = 60;
    card.querySelector('.label-like').style.opacity = cx > th ? Math.min(1, (cx - th) / 60) : 0;
    card.querySelector('.label-nope').style.opacity = cx < -th ? Math.min(1, (-cx - th) / 60) : 0;
  }
  function en() {
    if (!dragging) return;
    dragging = false;
    document.removeEventListener('mousemove', m);
    document.removeEventListener('touchmove', m);
    document.removeEventListener('mouseup', en);
    document.removeEventListener('touchend', en);
    if (cx > 100) doSwipe('like');
    else if (cx < -100) doSwipe('nope');
    else {
      card.style.transition = 'transform 0.3s cubic-bezier(.25,.8,.25,1)';
      card.style.transform = '';
      card.querySelector('.label-like').style.opacity = 0;
      card.querySelector('.label-nope').style.opacity = 0;
    }
    cx = 0;
  }
}

// ══════════ 滑動 ══════════
async function doSwipe(dir) {
  const pet = filteredPets[currentIndex];
  if (!pet) return;
  const card = document.querySelector('.pet-card.z2');
  if (card) { card.style.transition = 'none'; card.classList.add(dir === 'like' ? 'fly-right' : 'fly-left'); }
  if (dir === 'like') { await saveLike(pet); updateShelf(); }
  currentIndex++;
  setTimeout(renderStack, 360);
}

// ══════════ 收藏 ══════════
async function loadLiked() {
  if (!currentUser) return;
  const { data } = await sbClient.from('liked_pets').select('animal_id, pet_data').eq('user_id', currentUser.id);
  if (data) {
    data.forEach(r => { likedSet.add(r.animal_id); likedData[r.animal_id] = r.pet_data; });
    updateShelf();
    const b = document.getElementById('liked-badge');
    if (likedSet.size > 0) { b.textContent = likedSet.size; b.classList.remove('hidden'); }
  }
}
async function saveLike(pet) {
  likedSet.add(pet.id); likedData[pet.id] = pet;
  if (currentUser) {
    await sbClient.from('liked_pets').upsert({ user_id: currentUser.id, animal_id: pet.id, pet_data: pet });
  }
  const b = document.getElementById('liked-badge');
  b.textContent = likedSet.size; b.classList.remove('hidden');
}
async function removeLike(id) {
  likedSet.delete(id); delete likedData[id];
  if (currentUser) await sbClient.from('liked_pets').delete().eq('user_id', currentUser.id).eq('animal_id', id);
  const b = document.getElementById('liked-badge');
  b.textContent = likedSet.size;
  if (!likedSet.size) b.classList.add('hidden');
  updateShelf(); renderSavedGrid();
}
function updateShelf() {
  const shelf = document.getElementById('liked-shelf');
  const row   = document.getElementById('shelf-row');
  const pets  = Object.values(likedData).slice(-8);
  if (!pets.length) { shelf.classList.add('hidden'); return; }
  shelf.classList.remove('hidden');
  row.innerHTML = pets.map(p => `
    <div class="shelf-item" onclick="window.open('${p.petUrl}','_blank')">
      <div class="shelf-thumb">
        ${p.photo ? `<img src="${p.photo}" alt="${p.species}" onerror="this.outerHTML='${p.emoji}'">` : p.emoji}
      </div>
      <div class="shelf-name">${p.species}</div>
    </div>`).join('');
}

// ══════════ 收藏頁 ══════════
function showSaved() { renderSavedGrid(); show('saved-screen'); }
function hideSaved() { hide('saved-screen'); }
function renderSavedGrid() {
  const grid = document.getElementById('saved-grid');
  const pets = Object.values(likedData);
  if (!pets.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><span class="empty-icon">🤍</span>還沒有收藏的毛孩</div>';
    return;
  }
  grid.innerHTML = pets.map(p => `
    <div class="saved-card" onclick="window.open('${p.petUrl}','_blank')">
      ${p.photo
        ? `<img class="saved-card-img" src="${p.photo}" alt="${p.species}" onerror="this.style.display='none'">`
        : `<div class="saved-card-ph" style="background:${p.bg}">${p.emoji}</div>`}
      <div class="saved-card-info">
        <div class="saved-card-name">${p.species}</div>
        <div class="saved-card-meta">${p.breed}<br>${p.city} ${p.shelter}</div>
        <div class="saved-card-link">詳細資訊 <i class="ti ti-external-link" style="font-size:10px"></i></div>
      </div>
      <button class="remove-btn" onclick="event.stopPropagation();removeLike('${p.id}')" title="移除">✕</button>
    </div>`).join('');
}

// ══════════ 用戶選單 ══════════
function toggleMenu(forceClose) {
  const m = document.getElementById('user-menu-popup');
  if (forceClose) m.classList.add('hidden'); else m.classList.toggle('hidden');
}
document.addEventListener('click', e => {
  if (!e.target.closest('#avatar-btn') && !e.target.closest('#user-menu-popup'))
    document.getElementById('user-menu-popup').classList.add('hidden');
});

// ══════════ 輔助 ══════════
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function enableBtns(on) {
  ['btn-nope', 'btn-like'].forEach(id => document.getElementById(id).disabled = !on);
}
function setStatus(type, msg) {
  const el = document.getElementById('api-status');
  el.className = `api-status ${type}`;
  el.innerHTML = type === 'loading'
    ? `<div class="spinner" style="width:16px;height:16px;border-width:2px"></div><span>${msg}</span>`
    : `<i class="ti ti-${type === 'success' ? 'check' : 'alert-circle'}"></i><span>${msg}</span>`;
  if (type !== 'loading') setTimeout(() => el.classList.add('hidden'), 5000);
}
